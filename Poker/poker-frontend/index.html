<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker — Escolha sua sala</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lobby.css">
</head>
<body>
  <header class="topo">
    <a class="logo" href="index.html">
      <span class="naipes">♠<span class="r">♥</span>♣<span class="r">♦</span></span>
      Poker Hold'em
    </a>
    <div class="perfil">
      <label for="apelido" class="sr">Seu apelido</label>
      <div class="avatar" id="avatar">?</div>
      <input id="apelido" class="campo" maxlength="16" placeholder="Seu apelido" autocomplete="nickname">
    </div>
  </header>

  <main class="lobby">
    <section class="hero">
      <div>
        <h1>Escolha uma mesa</h1>
        <p>Texas Hold'em No-Limit · até 8 jogadores por mesa</p>
      </div>
      <button class="btn btn-ouro" id="btnCriar">＋ Criar sala</button>
    </section>

    <section class="resumo">
      <div class="stat"><span id="statSalas">–</span><small>salas abertas</small></div>
      <div class="stat"><span id="statJogadores">–</span><small>jogadores online</small></div>
      <div class="stat"><span id="statLivres">–</span><small>lugares livres</small></div>
    </section>

    <section class="filtros">
      <input id="busca" class="campo" type="search" placeholder="Buscar sala pelo nome…">
      <select id="filtroBlinds" class="campo">
        <option value="todas">Todos os blinds</option>
        <option value="baixo">Baixo (até 10/20)</option>
        <option value="medio">Médio (25/50 – 100/200)</option>
        <option value="alto">Alto (acima de 100/200)</option>
      </select>
      <label class="check"><input type="checkbox" id="ocultarCheias"> Ocultar cheias</label>
      <button class="btn btn-fantasma" id="btnAtualizar" title="Atualizar lista">↻ Atualizar</button>
    </section>

    <section class="salas" id="listaSalas" aria-live="polite">
      <!-- preenchido por js/lobby.js -->
    </section>
    <p class="vazio oculto" id="semSalas">Nenhuma sala encontrada com esses filtros.</p>
  </main>

  <!-- Modal: criar sala -->
  <div class="modal-fundo" id="modalCriar" role="dialog" aria-modal="true" aria-labelledby="tituloCriar">
    <form class="modal" id="formCriar">
      <h2 id="tituloCriar">Criar nova sala</h2>
      <div class="grade-form">
        <div class="col-2">
          <label class="rotulo" for="nomeSala">Nome da sala</label>
          <input class="campo" id="nomeSala" required maxlength="28" placeholder="Ex.: Mesa da Turma">
        </div>
        <div>
          <label class="rotulo" for="blinds">Blinds</label>
          <select class="campo" id="blinds">
            <option value="1/2">1 / 2</option>
            <option value="5/10" selected>5 / 10</option>
            <option value="10/20">10 / 20</option>
            <option value="25/50">25 / 50</option>
            <option value="50/100">50 / 100</option>
            <option value="100/200">100 / 200</option>
          </select>
        </div>
        <div>
          <label class="rotulo" for="maxJogadores">Jogadores</label>
          <select class="campo" id="maxJogadores">
            <option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option selected>8</option>
          </select>
        </div>
        <div>
          <label class="rotulo" for="qtdBots">Bots na mesa</label>
          <select class="campo" id="qtdBots">
            <option>0</option><option>1</option><option>2</option><option selected>3</option>
            <option>4</option><option>5</option><option>6</option><option>7</option>
          </select>
        </div>
        <div>
          <label class="rotulo" for="dificuldade">Dificuldade dos bots</label>
          <select class="campo" id="dificuldade">
            <option value="1">Fácil</option>
            <option value="2" selected>Médio</option>
            <option value="3">Difícil</option>
          </select>
        </div>
        <div class="col-2">
          <label class="rotulo">Buy-in: <strong id="buyInTexto">1.000</strong> fichas (100 big blinds)</label>
        </div>
        <label class="check col-2"><input type="checkbox" id="privada"> Sala privada 🔒</label>
      </div>
      <div class="acoes-modal">
        <button type="button" class="btn btn-fantasma" data-fechar>Cancelar</button>
        <button type="submit" class="btn btn-ouro">Criar e entrar</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
